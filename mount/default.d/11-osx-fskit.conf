# Enable the macFUSE FSKit backend (macFUSE >= 5.2.0)
# Mount points appear under /Volumes/cvmfs instead of /Users/Shared/cvmfs
CVMFS_USE_MACFUSE_FSKIT=yes

# FSKit mounts do not require root privileges.  Use per-user cache
# directories so that cvmfs can operate without sudo.  With a non-shared
# cache the workspace defaults to the per-repository cache directory; it
# must not be shared across repositories since lock_cachedb is held for the
# lifetime of the mount and a second repository would block on it.
CVMFS_USER=$(whoami)
CVMFS_CACHE_BASE=$HOME/Library/Caches/cvmfs
CVMFS_RELOAD_SOCKETS=$HOME/Library/Caches/cvmfs/run
