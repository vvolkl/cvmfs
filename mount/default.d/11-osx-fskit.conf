# Enable the macFUSE FSKit backend (macFUSE >= 5.2.0)
# Mount points appear under /Volumes/cvmfs instead of /Users/Shared/cvmfs
CVMFS_USE_MACFUSE_FSKIT=yes

# FSKit mounts do not require root privileges.  Use per-user cache and
# workspace directories so that cvmfs can operate without sudo.
CVMFS_USER=$(whoami)
CVMFS_CACHE_BASE=$HOME/Library/Caches/cvmfs
CVMFS_WORKSPACE=$HOME/Library/Caches/cvmfs/workspace
CVMFS_RELOAD_SOCKETS=$HOME/Library/Caches/cvmfs/run
CVMFS_SHARED_CACHE=no
