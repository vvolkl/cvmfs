name: cpp-linter
on:
  pull_request:
    paths: ['**.c', '**.cpp', '**.h', '**.hpp', '**.cxx', '**.hxx', '**.cc', '**.hh', '**CMakeLists.txt', '**.cmake']
  push:
    branches: [devel, cvmfs*, gh-actions-linter]
    #paths: ['**.c', '**.cpp', '**.h', '**.hpp', '**.cxx', '**.hxx', '**.cc', '**.hh', '**CMakeLists.txt', '**.cmake']

jobs:
  cpp-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Set Clang version
        shell: bash
        run: |
          echo "CLANG_VERSION=18" >> $GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/cache/restore@v4
        id: cachedeb-restore
        with:
          path: /tmp/cvmfs-build-deps_2.1.0_all.deb
          key: ${{ runner.os }}-${{ hashFiles('**/packaging/debian/cvmfs/control') }}
      - name: Generate build-dep metapackage
        if: steps.cachedeb-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y devscripts equivs
          mk-build-deps ./packaging/debian/cvmfs/control
          mv cvmfs-build-deps_2.1.0_all.deb /tmp
      - uses: actions/cache/save@v4
        if: steps.cachedeb-restore.outputs.cache-hit != 'true'
        id: cachedeb-save
        with:
          path: /tmp/cvmfs-build-deps_2.1.0_all.deb
          key: ${{ runner.os }}-${{ hashFiles('**/packaging/debian/cvmfs/control') }}
      - name: Install build dependencies
        run: |
          sudo apt-get install -y /tmp/cvmfs-build-deps_2.1.0_all.deb
      - name: Hash Externals
        id: get-externals-hash
        run: |
          ls 
          echo "hash=$(ls -Rs externals | sha1sum)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache/restore@v4
        id: cache-externals-restore
        with:
          path: externals_install
          key: ${{ runner.os }}-${{ steps.get-externals-hash.outputs.hash }}
      - name: Generate compilation database
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - uses: actions/cache/save@v4
        if: steps.cache-externals-restore.outputs.cache-hit != 'true'
        id: cache-externals-save
        with:
          path: externals_install
          key: ${{ runner.os }}-${{ steps.get-externals-hash.outputs.hash }}
      - name: Install LLVM
        run: |
          wget  https://apt.llvm.org/llvm.sh
          sudo chmod +x llvm.sh
          sudo ./llvm.sh all
        shell: bash
      - name: Run clang-tidy-diff - Pull Request
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff -U0  ${{ github.base_ref  }} | /usr/lib/llvm-${{ env.CLANG_VERSION }}/share/clang/clang-tidy-diff.py -clang-tidy-binary clang-tidy-${{ env.CLANG_VERSION }} -use-color -path ./build -p1  | tee clang-tidy.out
        shell: bash
      - name: Run clang-tidy-diff - Push
        if: github.event_name == 'push'
        run: |
          git diff -U0 HEAD HEAD~   | /usr/lib/llvm-${{ env.CLANG_VERSION }}/share/clang/clang-tidy-diff.py -clang-tidy-binary clang-tidy-${{ env.CLANG_VERSION }} -use-color -path ./build -p1 | tee clang-tidy.out 
        shell: bash
      - name: Generate Summary
        if: ${{ success() || failure() }}
        run: |
          echo '### Clang-Tidy Summary ' >> $GITHUB_STEP_SUMMARY
          echo ' ' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat clang-tidy.out | sed -e 's/\x1b\[[0-9;]*m//g' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash
      - name: Generate Annotations
        if: ${{ success() || failure() }}
        run: |
          echo "::error file={cvmfs/duplex_curl.h},line={11},title={error: included header curl.h is not used directly [misc-include-cleaner,-warnings-as-errors]}::{message text line 1 %0A line2 %0A line3}
        shell: bash



