name: CI_MacOS

on:
  push:
    branches: ['devel', 'cvmfs*']
  pull_request:
    branches: ['devel', 'cvmfs*']
  workflow_dispatch:
jobs:
  macos_build_and_test:
    name: "macos_build_and_test"
    # macOS 15.7.9 (the macos-15 image) rejects every FSKit mount, including
    # Apple's own modules; macOS 26 works.
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug output
        run: |
          csrutil status
          sw_vers
          brew install coreutils
          sudo ln -s /usr/local/bin/gtimeout /usr/local/bin/timeout
          sudo ln -s /opt/homebrew/bin/greadlink /usr/local/bin/greadlink
          sudo mkdir -p /usr/local/include

      - name: Install macFUSE (FSKit backend)
        run: |
          brew install python-setuptools
          # FSKit mounts need macFUSE >= 5.4.0
          MACFUSE_VERSION=5.4.0
          wget -q https://github.com/macfuse/macfuse/releases/download/macfuse-${MACFUSE_VERSION}/macfuse-${MACFUSE_VERSION}.dmg
          hdiutil attach macfuse-${MACFUSE_VERSION}.dmg
          MACFUSE_PKG=$(find /Volumes/macFUSE -name "*.pkg" | head -1)
          sudo installer -pkg "${MACFUSE_PKG}" -target /
          hdiutil detach /Volumes/macFUSE || true
          # The FSKit module is an app extension that has to be enabled
          # before it can be used (System Settings > File System Extensions)
          MACFUSE_APP=/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app
          for m in macfuse macfuse-local; do
            pluginkit -a ${MACFUSE_APP}/Contents/Extensions/io.macfuse.app.fsmodule.${m}.appex || true
            pluginkit -e use -i io.macfuse.app.fsmodule.${m} || true
          done
          pluginkit -m -v -p com.apple.fskit.fsmodule || true
          ls -la /usr/local/lib/libfuse* /usr/local/include/fuse3

      - name: Build CVMFS
        run: |
          cd ${GITHUB_WORKSPACE}
          mkdir -p build
          export USE_MACFUSE_KEXT=OFF
          export USE_MACFUSE_FSKIT=ON
          export CVMFS_EXTERNALS_EXCLUDE="zlib"
          export CPATH=$CPATH:/usr/local/include
          ./ci/build_package.sh ${GITHUB_WORKSPACE} ${GITHUB_WORKSPACE}/build cvmfs

      - name: Setup firmlinks
        run: |
          # / is readonly on macos 11+; synthetic.conf entries only take
          # effect for paths that do not exist yet, so /cvmfs must point to
          # the FSKit mount directory before the package's postinstall runs
          sudo mkdir -p /Volumes/cvmfs
          sudo zsh -c 'echo -e "cvmfs\tVolumes/cvmfs\n#comment\n" > /etc/synthetic.conf'
          sudo chown root:wheel /etc/synthetic.conf
          sudo chmod a+r /etc/synthetic.conf
          # apfs.util seems to return non-zero error codes also on success
          sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -t || true
          ls -la /cvmfs

      - name: Install CVMFS
        run: |
          export CVMFS_PACKAGE=$(ls ${GITHUB_WORKSPACE}/build/pkg_result/cvmfs-*.pkg)
          sudo installer -pkg ${CVMFS_PACKAGE} -target /

      - name: Setup CVMFS
        run: |
          cat /tmp/cvmfs_postinstall || true
          sudo env CVMFS_USE_MACFUSE_FSKIT=yes cvmfs_config setup
          sudo env CVMFS_USE_MACFUSE_FSKIT=yes cvmfs_config chksetup || exit 1
          ls -la /cvmfs /Volumes/cvmfs
          cat /etc/synthetic.conf

      - name: Smoke mount
        run: |
          sudo sh -c 'echo "CVMFS_HTTP_PROXY=DIRECT" > /etc/cvmfs/default.local'
          sudo sh -c 'echo "CVMFS_DEBUGLOG=/tmp/cvmfs-smoke-debug.log" >> /etc/cvmfs/default.local'
          sudo cvmfs_config showconfig cvmfs-config.cern.ch \
            | grep -E "^CVMFS_(USER|CACHE_BASE|RELOAD_SOCKETS|USE_MACFUSE_FSKIT|MOUNT_DIR)="
          # FSKit mounts are unprivileged
          mkdir -p /cvmfs/cvmfs-config.cern.ch
          mount_cvmfs cvmfs-config.cern.ch /cvmfs/cvmfs-config.cern.ch; echo "mount rc=$?"
          sleep 3
          mount | grep -i "fskit\|cvmfs" || true
          ls -la /cvmfs/cvmfs-config.cern.ch || true
          sudo cvmfs_config status || true
          sudo cvmfs_config probe || true
          sudo cvmfs_config umount || true
          sudo tail -80 /tmp/cvmfs-smoke-debug.log || true
          ls -la ~/Library/Caches/cvmfs ~/Library/Caches/cvmfs/run || true
          sudo rm -f /etc/cvmfs/default.local

      - name: Run Tests
        run: |
          sudo launchctl limit maxfiles 65536 65536
          export CVMFS_PLATFORM_NAME="macos"
          export CVMFS_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          export CVMFS_TEST_CLASS_NAME=ClientIntegrationTests
          export CVMFS_TEST_PROXY=DIRECT
          export CVMFS_TEST_USE_CDN=yes
          export CVMFS_TEST_USE_MACFUSE_KEXT=no
          export CVMFS_TEST_USE_MACFUSE_FSKIT=yes
          export CVMFS_TEST_DEBUGLOG=/tmp/cvmfs-debug.log
          cd $GITHUB_WORKSPACE/test
          ./run.sh /tmp/cvmfs-client-test.log -o /tmp/cvmfs-client-test.xunit.xml \
            -s quick                                          \
            -x src/004-davinci                                \
            src/005-asetup                                    \
            src/006-buildkernel                               \
            src/007-testjobs                                  \
            src/008-default_domain                            \
            src/015-rebuild_on_crash                          \
            src/016-dnsunreachable                            \
            src/017-dnstimeout                                \
            src/024-reload-during-asetup                      \
            src/028-negativecache                             \
            src/039-reloadalarm                               \
            src/040-aliencache                                \
            src/041-rocache                                   \
            src/045-oasis                                     \
            src/052-roundrobindns                             \
            src/050-configrepo                                \
            src/053-uuid                                      \
            src/055-ownership                                 \
            src/056-lowspeedlimit                             \
            src/057-parallelmakecache                         \
            src/059-fallbackproxy                             \
            src/060-hidexattrs                                \
            src/061-systemdnokill                             \
            src/064-fsck                                      \
            src/069-systemremount                             \
            src/074-oom                                       \
            src/077-doublemount                               \
            src/078-offlinemode                               \
            src/081-shrinkwrap                                \
            src/082-shrinkwrap-cms                            \
            src/083-suid                                      \
            src/084-premounted                                \
            src/087-xattrs                                    \
            src/088-watchdog                                  \
            src/089-external_cache_plugin                     \
            src/090-talkchroot                                \
            src/091-defaultconfigrepo                         \
            src/091-talksocket                                \
            src/092-stat                                      \
            src/094-attachmount                               \
            src/095-fuser                                     \
            src/096-cancelreq                                 \
            src/097-statfs                                    \
            src/099-http_tracing                              \
            src/100-reload-switch-debug                       \
            src/102-reusefd                                   \
            src/103-reloadcachemgr                            \
            src/104-concurrent_mounts                         \
            src/105-streaming-cache                           \
            src/108-global-config                             \
            src/406-ducc-webhook-notifications                \
            --                                                \
            src/0*                                            \
            src/1*

      - name: Collect diagnostics
        if: ${{ always () }}
        run: |
          mount > /tmp/cvmfs-mounts.txt || true
          sudo cvmfs_config status >> /tmp/cvmfs-mounts.txt 2>&1 || true
          sudo log show --last 30m --style compact \
            --predicate 'process CONTAINS "cvmfs" OR process CONTAINS "macfuse" OR process CONTAINS "fskit" OR subsystem CONTAINS "macfuse" OR subsystem CONTAINS "FSKit"' \
            > /tmp/cvmfs-unified.log 2>&1 || true
          tail -50 /tmp/cvmfs-unified.log || true

      - name: Upload logs as artifact
        if: ${{ always () }}
        uses: actions/upload-artifact@v4
        with:
          name: CVMFS test logs
          path: |
              /tmp/cvmfs-client-test.log
              /tmp/cvmfs-client-test.xunit.xml
              /tmp/cvmfs_postinstall
              /tmp/cvmfs-mounts.txt
              /tmp/cvmfs-unified.log
              /tmp/cvmfs-smoke-debug.log
              /tmp/cvmfs-debug.log
