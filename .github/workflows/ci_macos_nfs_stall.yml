name: CI_MacOS_NFS_Stall

# Runs AIDASoft/DD4hep's macOS build and tests over the NFS frontend and
# samples cvmfs2 whenever it stops answering NFS requests.  With
# deadtimeout=120 such a stall makes the kernel force-unmount the repository
# and every process mapping a library from it dies with SIGBUS.
#   plain:    package defaults
#   nodead:   CVMFS_NFS_MOUNT_OPTIONS=deadtimeout=0, survives stalls so their
#             full length and cause can be recorded
#   noupdate: CVMFS_AUTO_UPDATE=no, no catalog switches during the job
#   nfsdebug: as nodead, plus the RPC server's per-request trace
#             (CVMFS_NFS4_DEBUG) of sft-nightlies: shows whether requests
#             sent during a stall are received and queued
#   quiet:    as nodead, plus CVMFS_AUTO_UPDATE=no, and the watchdog detects
#             stalls with userspace NULL calls instead of lookups through
#             the kernel NFS client: no load from the instrumentation on
#             the NFS mounts
#   quietdebug: as quiet, plus the sft-nightlies request trace
on:
  push:
    branches: [ 'ci-macos-nfs-stall*' ]
  workflow_dispatch:
    inputs:
      pkg:
        description: macOS package URL
        default: https://ecsft.cern.ch/dist/cvmfs/prerelease/cvmfs-2.15.0-pre5/cvmfs-2.15.0~pre5.pkg
      matrix:
        description: JSON list of {LCG, variant, os (default macos-15)}; empty runs the full matrix
        default: ''

env:
  PKG: ${{ inputs.pkg || 'https://ecsft.cern.ch/dist/cvmfs/prerelease/cvmfs-2.15.0-pre5/cvmfs-2.15.0~pre5.pkg' }}
  REPOS: sft-nightlies.cern.ch sft.cern.ch geant4.cern.ch
  # wdconinc/DD4hep patch-13 as in AIDASoft/DD4hep run 43640275205
  DD4HEP_SHA: a922955af63043ce56ffb8c42a4a43edc41c6f7f

jobs:
  dd4hep:
    runs-on: ${{ matrix.os || 'macos-15' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix || '[{"LCG":"dev4/arm64-mac15-clang170-opt","variant":"plain"},{"LCG":"dev4/arm64-mac15-clang170-opt","variant":"nodead"},{"LCG":"dev4/arm64-mac15-clang170-opt","variant":"nfsdebug"},{"LCG":"dev3/arm64-mac15-clang170-opt","variant":"nfsdebug"}]') }}
    env:
      LOGS: ${{ github.workspace }}/logs
    steps:
      - name: Start log stream
        run: |
          mkdir -p "$LOGS"
          sw_vers; uname -a; sysctl -n hw.ncpu
          sudo sh -c "nohup log stream --style compact --level debug \
            --predicate 'process == \"cvmfs2\" OR process == \"mount_nfs\" OR (process == \"kernel\" AND eventMessage CONTAINS[c] \"nfs\")' \
            > $LOGS/logstream.txt 2>&1 &"

      - uses: cvmfs-contrib/github-action-cvmfs@6d6f483b3625214f88977d62575b69a55d21828e
        with:
          cvmfs_repositories: sft.cern.ch,sft-nightlies.cern.ch,geant4.cern.ch
          cvmfs_quota_limit: 15000
          cvmfs_macos_pkg_location: ${{ env.PKG }}

      - name: Configure variant and remount
        run: |
          case "${{ matrix.variant }}" in
            nodead|nfsdebug) echo "CVMFS_NFS_MOUNT_OPTIONS=deadtimeout=0" | sudo tee -a /etc/cvmfs/default.local ;;
            noupdate) echo "CVMFS_AUTO_UPDATE=no" | sudo tee -a /etc/cvmfs/default.local ;;
            quiet|quietdebug)
              printf 'CVMFS_NFS_MOUNT_OPTIONS=deadtimeout=0\nCVMFS_AUTO_UPDATE=no\n' | sudo tee -a /etc/cvmfs/default.local ;;
          esac
          for r in $REPOS; do sudo umount /Volumes/cvmfs/$r; done
          # cvmfs2 runs unprivileged and opens the trace file itself
          touch "$RUNNER_TEMP/nfs4debug.log"; chmod 666 "$RUNNER_TEMP/nfs4debug.log"
          for r in $REPOS; do
            if { [ "${{ matrix.variant }}" = nfsdebug ] || [ "${{ matrix.variant }}" = quietdebug ]; } \
               && [ $r = sft-nightlies.cern.ch ]; then
              sudo env CVMFS_NFS4_DEBUG="$RUNNER_TEMP/nfs4debug.log" mount -t cvmfs $r /Volumes/cvmfs/$r
            else
              sudo mount -t cvmfs $r /Volumes/cvmfs/$r
            fi
          done
          mount | grep cvmfs | tee "$LOGS/mounts-start.txt"
          for r in $REPOS; do
            echo "=== $r"
            cvmfs_config showconfig $r 2>&1 | grep -E "AUTO_UPDATE|MAX_TTL|NFS|SERVER_URL|USE_CDN|TIMEOUT|MAX_RETRIES|QUOTA"
          done | tee "$LOGS/config.txt"

      - name: Start stall watchdog
        run: |
          cat > "$RUNNER_TEMP/rpcprobe.py" << 'EOF'
          """NFSv4 NULL-call probe against the cvmfs2 NFS server.

            once PORT          fresh connection per credential flavor, one call each
            loop PORT SECONDS  one persistent connection, a call every SECONDS
          """
          import select
          import socket
          import struct
          import sys
          import time

          LAST = 0x80000000
          TIMEOUT = 10.0


          def ts():
              return time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())


          def null_call(xid, flavor):
              if flavor == 'sys':
                  machine = b'probe'
                  pad = b'\0' * ((4 - len(machine) % 4) % 4)
                  body = struct.pack('>II', int(time.time()) & 0xffffffff, len(machine))
                  body += machine + pad + struct.pack('>III', 0, 0, 0)
                  cred = struct.pack('>II', 1, len(body)) + body
              else:
                  cred = struct.pack('>II', 0, 0)
              msg = struct.pack('>IIIIII', xid, 0, 2, 100003, 4, 0) + cred
              msg += struct.pack('>II', 0, 0)
              return struct.pack('>I', LAST | len(msg)) + msg


          class Records(object):
              """Reassembles RPC records from a TCP byte stream"""
              def __init__(self):
                  self.buf = b''
                  self.frags = b''

              def feed(self, data):
                  self.buf += data
                  out = []
                  while len(self.buf) >= 4:
                      marker = struct.unpack('>I', self.buf[:4])[0]
                      length = marker & ~LAST
                      if len(self.buf) < 4 + length:
                          break
                      self.frags += self.buf[4:4 + length]
                      self.buf = self.buf[4 + length:]
                      if marker & LAST:
                          out.append(self.frags)
                          self.frags = b''
                  return out

              def partial(self):
                  return len(self.buf) + len(self.frags)


          def describe(rec):
              if len(rec) < 12:
                  return None, 'short record (%d bytes): %s' % (len(rec), rec.hex())
              xid, mtype, stat = struct.unpack('>III', rec[:12])
              if mtype != 1:
                  return xid, 'not a reply (type %d)' % mtype
              if stat != 0:
                  return xid, 'denied (reply_stat %d)' % stat
              if len(rec) < 24:
                  return xid, 'truncated accepted reply'
              vlen = struct.unpack('>I', rec[16:20])[0]
              off = 20 + ((vlen + 3) & ~3)
              if len(rec) < off + 4:
                  return xid, 'truncated accepted reply'
              accept = struct.unpack('>I', rec[off:off + 4])[0]
              return xid, 'accept_stat %d%s' % (accept, '' if accept == 0 else ' (error)')


          def connect(port):
              t0 = time.time()
              s = socket.create_connection(('127.0.0.1', port), timeout=TIMEOUT)
              return s, (time.time() - t0) * 1000


          def once(port):
              ok = True
              for i, flavor in enumerate(('none', 'sys')):
                  xid = 0x50000000 + int(time.time()) % 0x1000000 * 2 + i
                  try:
                      s, t_conn = connect(port)
                  except OSError as e:
                      print('%s %s: connect failed: %s' % (ts(), flavor, e))
                      ok = False
                      continue
                  t0 = time.time()
                  s.sendall(null_call(xid, flavor))
                  t_write = (time.time() - t0) * 1000
                  records, got, reply = Records(), 0, None
                  deadline = time.time() + TIMEOUT
                  while reply is None and time.time() < deadline:
                      r, _, _ = select.select([s], [], [], max(0, deadline - time.time()))
                      if not r:
                          break
                      data = s.recv(65536)
                      if not data:
                          break
                      got += len(data)
                      for rec in records.feed(data):
                          reply = rec
                  t_reply = (time.time() - t0) * 1000
                  if reply is None:
                      print('%s %s: connect %.1f ms, write %.1f ms, NO REPLY after %.0f ms '
                            '(%d bytes received, %d unparsed)'
                            % (ts(), flavor, t_conn, t_write, t_reply, got, records.partial()))
                      ok = False
                  else:
                      rxid, desc = describe(reply)
                      valid = rxid == xid and desc == 'accept_stat 0'
                      ok = ok and valid
                      print('%s %s: connect %.1f ms, write %.1f ms, reply %.1f ms, xid %s, %s'
                            % (ts(), flavor, t_conn, t_write, t_reply,
                               'ok' if rxid == xid else 'MISMATCH %s' % rxid, desc))
                  s.close()
              return 0 if ok else 1


          def loop(port, interval):
              xid = 0x60000000
              while True:
                  try:
                      s, t_conn = connect(port)
                  except OSError as e:
                      print('%s connect failed: %s' % (ts(), e), flush=True)
                      time.sleep(interval)
                      continue
                  print('%s connected in %.1f ms from port %d'
                        % (ts(), t_conn, s.getsockname()[1]), flush=True)
                  records, pending, next_send = Records(), {}, 0.0
                  try:
                      while True:
                          now = time.time()
                          if now >= next_send:
                              xid += 1
                              flavor = 'sys' if xid % 2 else 'none'
                              s.sendall(null_call(xid, flavor))
                              pending[xid] = (now, flavor, False)
                              next_send = now + interval
                          for x, (sent, flavor, warned) in list(pending.items()):
                              if not warned and now - sent > TIMEOUT:
                                  print('%s xid %d (%s) unanswered for %.0f s, %d pending, '
                                        '%d bytes unparsed' % (ts(), x, flavor, now - sent,
                                                               len(pending), records.partial()),
                                        flush=True)
                                  pending[x] = (sent, flavor, True)
                          r, _, _ = select.select([s], [], [], max(0.05, next_send - time.time()))
                          if not r:
                              continue
                          data = s.recv(65536)
                          if not data:
                              print('%s connection closed by server, %d pending'
                                    % (ts(), len(pending)), flush=True)
                              break
                          for rec in records.feed(data):
                              rxid, desc = describe(rec)
                              if rxid in pending:
                                  sent, flavor, warned = pending.pop(rxid)
                                  lat = (time.time() - sent) * 1000
                                  # Log slow, late or failed replies, and a heartbeat
                                  if warned or lat > 1000 or 'error' in desc or rxid % 60 == 0:
                                      print('%s xid %d (%s) %.1f ms, %s'
                                            % (ts(), rxid, flavor, lat, desc), flush=True)
                              else:
                                  print('%s unexpected reply xid %s, %s' % (ts(), rxid, desc),
                                        flush=True)
                  except OSError as e:
                      print('%s socket error: %s, %d pending' % (ts(), e, len(pending)),
                            flush=True)
                  s.close()
                  time.sleep(1)


          def wait(port):
              """NULL call on a new connection, blocks until the reply"""
              xid = 0x58000000 + int(time.time()) % 0x1000000
              s, _ = connect(port)
              s.settimeout(None)
              s.sendall(null_call(xid, 'none'))
              records = Records()
              while True:
                  data = s.recv(65536)
                  if not data:
                      return 1
                  for rec in records.feed(data):
                      return 0 if describe(rec) == (xid, 'accept_stat 0') else 1


          if __name__ == '__main__':
              if sys.argv[1] == 'once':
                  sys.exit(once(int(sys.argv[2])))
              if sys.argv[1] == 'wait':
                  sys.exit(wait(int(sys.argv[2])))
              loop(int(sys.argv[2]), float(sys.argv[3]))
          EOF
          nfsport() { nfsstat -m | sed -n "\|^/Volumes/cvmfs/$1 |,/^\$/p" | grep -m1 -oE 'port=[0-9]+' | cut -d= -f2; }
          # A userspace client on its own connection, before and during a stall:
          # tells a stuck server from a stuck kernel client
          for r in $REPOS; do
            nohup python3 -I "$RUNNER_TEMP/rpcprobe.py" loop $(nfsport $r) 5 > "$LOGS/rpcprobe-$r.txt" 2>&1 &
          done
          # Headers and RPC framing of the sft-nightlies NFS traffic in a
          # ~200 MB ring; the watchdog keeps the files around a stall
          mkdir -p "$RUNNER_TEMP/pcap"
          sudo sh -c "nohup tcpdump -i lo0 -n -s 512 -C 20 -W 10 -w $RUNNER_TEMP/pcap/lo0.pcap \
            tcp port $(nfsport sft-nightlies.cern.ch) > $LOGS/tcpdump.txt 2>&1 &"
          cat > "$RUNNER_TEMP/watchdog.sh" << 'EOF'
          #!/bin/bash
          # Probes each mount with lookups of fresh names (always reach cvmfs2),
          # or with $2 = rpc with NULL calls on new connections, which bypass
          # the kernel NFS client. A probe pending for more than 5 s is a
          # stall: sample the server and dump its counters every 15 s until
          # the probe returns.
          r=$1; mode=${2:-stat}; out=$LOGS/stall-$r; mkdir -p $out
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          now() { perl -MTime::HiRes=time -e 'printf "%.1f", time'; }
          i=0
          while true; do
            i=$((i+1))
            if [ $mode = rpc ]; then
              [ -n "$rport" ] || rport=$(t 10 nfsstat -m | sed -n "\|^/Volumes/cvmfs/$r |,/^\$/p" | grep -m1 -oE 'port=[0-9]+' | cut -d= -f2)
              t 900 python3 -I $RUNNER_TEMP/rpcprobe.py wait $rport >/dev/null 2>&1 &
            else
              t 900 stat /Volumes/cvmfs/$r/.stallprobe-$i >/dev/null 2>&1 &
            fi
            probe=$!; start=$(now); n=0
            while kill -0 $probe 2>/dev/null; do
              sleep 1; n=$((n+1))
              if [ $n -ge 5 ] && [ $(( (n-5) % 15 )) -eq 0 ] && [ $n -le 245 ]; then
                ts=$(date -u +%H%M%S)
                # Save the onset first; the diagnostics below can take a while
                if [ "$r" = sft-nightlies.cern.ch ] && { [ $n -eq 5 ] || [ $n -eq 125 ]; }; then
                  mkdir -p $out/pcap-$ts
                  find $RUNNER_TEMP/pcap -name 'lo0.pcap*' -mmin -4 -exec cp -p {} $out/pcap-$ts/ \;
                  [ -s $RUNNER_TEMP/nfs4debug.log ] && tail -n 300000 $RUNNER_TEMP/nfs4debug.log | gzip > $out/nfs4debug-$ts.log.gz
                fi
                pid=$(t 5 cvmfs_talk -i $r pid 2>/dev/null)
                echo "$(date -u +%FT%TZ) $r probe $i pending ${n}s, pid=$pid" | tee -a $out/stalls.txt
                {
                  echo "##### $(date -u +%FT%TZ) pending ${n}s"
                  t 10 cvmfs_talk -i $r revision
                  t 10 cvmfs_talk -i $r internal affairs | grep -E '^[A-Za-z0-9_.-]+\|[1-9-]' | cut -d'|' -f1,2 | tr '\n' ' '
                  echo
                  t 10 cvmfs_talk -i $r host info
                  t 10 cvmfs_talk -i $r proxy info
                  echo "tcp: $(lsof -a -p $pid -i TCP 2>/dev/null | grep -c ESTABLISHED) established"
                } >> $out/talk-$ts.txt 2>&1
                spid=
                [ -n "$pid" ] && { t 30 sample $pid 3 -mayDie -file $out/sample-$ts.txt >/dev/null 2>&1 & spid=$!; }
                # Is the RPC job queue non-empty while all workers wait? At
                # 35 s, also broadcast its condition variable: replies that
                # resume afterwards mean lost wakeups
                if [ "$r" = sft-nightlies.cern.ch ] && [ -n "$pid" ] \
                   && { [ $n -eq 20 ] || [ $n -eq 35 ] || [ $n -eq 50 ]; }; then
                  [ -n "$spid" ] && wait $spid
                  bc=0; [ $n -eq 35 ] && bc=1
                  RPCQ_BROADCAST=$bc t 60 lldb -p $pid --batch \
                    -o "command script import $RUNNER_TEMP/rpcq.py" \
                    > $out/rpcq-$ts.txt 2>&1
                  # Did the workers drain the queue once the process ran again?
                  if [ $bc = 1 ]; then
                    sleep 3
                    t 60 lldb -p $pid --batch -o "command script import $RUNNER_TEMP/rpcq.py" \
                      > $out/rpcq-$ts-after.txt 2>&1
                  fi
                fi
                {
                  echo "##### $(date -u +%FT%TZ) pending ${n}s"
                  t 10 netstat -anv -p tcp | grep -E '^Proto|127\.0\.0\.1'
                  t 10 nfsstat -m
                  t 10 nfsstat -c
                  t 10 memory_pressure -Q
                  t 10 vm_stat
                  t 10 top -l 1 -n 15 -o cpu -stats pid,command,cpu,mem,state
                } >> $out/kernel-$ts.txt 2>&1
                # Which descriptors and processes hold the NFS sockets.
                # lsof -b: no stat() of files on the stalled mount.
                if [ $n -eq 5 ] || [ $n -eq 95 ]; then
                  port=$(t 10 nfsstat -m | sed -n "\|^/Volumes/cvmfs/$r |,/^\$/p" | grep -m1 -oE 'port=[0-9]+' | cut -d= -f2)
                  {
                    echo "##### $(date -u +%FT%TZ) pending ${n}s port=$port"
                    t 20 lsof -b -w -nP -iTCP:$port
                    echo "--- fds of $pid"
                    t 20 lsof -b -w -nP -p $pid
                    echo "--- processes"
                    ps -axo pid,ppid,lstart,command | grep -E 'cvmfs2|mount_nfs' | grep -v grep
                    # Does cvmfs2 answer a fresh TCP client, and can it
                    # still download?
                    echo "--- NULL call on a new connection"
                    t 40 python3 -I $RUNNER_TEMP/rpcprobe.py once $port
                    echo "rc=$?"
                    echo "--- host probe"
                    t 30 cvmfs_talk -i $r host probe
                    t 10 cvmfs_talk -i $r host info
                  } >> $out/fds-$ts.txt 2>&1
                fi
              fi
            done
            wait $probe; rc=$?
            dur=$(perl -e "printf '%.1f', $(now) - $start")
            if perl -e "exit !($dur > 2)"; then
              echo "$(date -u +%FT%TZ) $r probe $i took ${dur}s rc=$rc" | tee -a $out/stalls.txt
            fi
            if [ $mode = rpc ]; then sleep 5; else sleep 1; fi
          done
          EOF
          chmod +x "$RUNNER_TEMP/watchdog.sh"
          # Offsets into nfs4::RpcServer from the 2.15.0~pre5 arm64 dylib
          # (WorkerLoop keeps `this` in x19)
          cat > "$RUNNER_TEMP/rpcq.py" << 'EOF'
          import os
          import lldb

          # 2.15.0~pre5 arm64 libcvmfs_nfsfuse; ReadLoop notifies and
          # WorkerLoop waits on x19 + QUEUE_COND (std::condition_variable is
          # a bare pthread_cond_t in libc++)
          UUID = '71B3E32A-CA36-3C78-94BD-521789A58A29'
          STOPPING, QUEUE_LOCK, QUEUE_COND = 0x1a, 0xd0, 0x110
          Q_MAP, Q_START, Q_SIZE = 0x148, 0x160, 0x168
          PER_BLOCK, JOB_SIZE, JOB_XID = 0x55, 0x30, 0x10

          def u(proc, addr, size):
              err = lldb.SBError()
              v = proc.ReadUnsignedFromMemory(addr, size, err)
              return v if err.Success() else None

          def hexdump(proc, addr, size):
              err = lldb.SBError()
              b = proc.ReadMemory(addr, size, err)
              return b.hex() if err.Success() else str(err)

          def dump(proc, this):
              size = u(proc, this + Q_SIZE, 8)
              start = u(proc, this + Q_START, 8)
              print('this=%#x stopping=%s queue_size=%s start=%s'
                    % (this, u(proc, this + STOPPING, 1), size, start))
              print('queue_lock @%#x %s' % (this + QUEUE_LOCK, hexdump(proc, this + QUEUE_LOCK, 64)))
              print('queue_cond @%#x %s' % (this + QUEUE_COND, hexdump(proc, this + QUEUE_COND, 48)))
              qmap = u(proc, this + Q_MAP, 8)
              for i in range(min(size or 0, 20)):
                  k = start + i
                  block = u(proc, qmap + (k // PER_BLOCK) * 8, 8)
                  print('  job %d xid %s' % (i, u(proc, block + (k % PER_BLOCK) * JOB_SIZE
                                                    + JOB_XID, 4)))

          def x19_of(th, func):
              for f in th:
                  if func in (f.GetFunctionName() or ''):
                      return f.FindRegister('x19').GetValueAsUnsigned()
              return None

          def __lldb_init_module(debugger, internal_dict):
              target = debugger.GetSelectedTarget()
              proc = target.GetProcess()
              uuid = None
              for m in target.module_iter():
                  if m.GetFileSpec().GetFilename().startswith('libcvmfs_nfsfuse'):
                      uuid = m.GetUUIDString()
              print('libcvmfs_nfsfuse uuid %s (expected %s)' % (uuid, UUID))
              workers, readers, waiting = {}, {}, 0
              for th in proc:
                  names = [f.GetFunctionName() or '' for f in th]
                  w = x19_of(th, 'RpcServer::WorkerLoop')
                  r = x19_of(th, 'RpcServer::ReadLoop')
                  if w is not None:
                      workers[w] = workers.get(w, 0) + 1
                      if any('condition_variable::wait' in n for n in names):
                          waiting += 1
                  if r is not None:
                      readers[r] = readers.get(r, 0) + 1
              fmt = lambda d: ', '.join('%#x x%d' % kv for kv in d.items())
              print('worker this: %s (waiting in cv: %d)' % (fmt(workers), waiting))
              print('reader this: %s' % fmt(readers))
              if not workers:
                  return
              this = max(workers, key=workers.get)
              dump(proc, this)
              if os.environ.get('RPCQ_BROADCAST') == '1':
                  if uuid != UUID or set(readers) - {this}:
                      print('not broadcasting: unknown binary or readers on another object')
                      return
                  th = proc.GetSelectedThread()
                  r = th.GetSelectedFrame().EvaluateExpression(
                      '((int (*)(void *))pthread_cond_broadcast)((void *)%#x)' % (this + QUEUE_COND))
                  print('pthread_cond_broadcast -> %s %s' % (r.GetValue(), r.GetError()))
                  dump(proc, this)
          EOF
          for r in $REPOS; do
            case "${{ matrix.variant }}" in quiet*) mode=rpc ;; *) mode=stat ;; esac
            sudo -E nohup "$RUNNER_TEMP/watchdog.sh" $r $mode > "$LOGS/watchdog-$r.txt" 2>&1 &
          done
          # Revision log: catalog switches line up with stalls or not
          cat > "$RUNNER_TEMP/revisions.sh" << 'EOF'
          #!/bin/bash
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          while true; do
            echo "$(date -u +%FT%TZ) $(for r in $REPOS; do echo -n "$r=$(t 5 cvmfs_talk -i $r revision 2>/dev/null) "; done)"
            # Baseline load, to compare with the stall snapshots
            echo "  $(sysctl -n vm.loadavg) $(t 5 memory_pressure -Q | tail -1) $(sysctl -n vm.swapusage)"
            pid=$(t 5 cvmfs_talk -i sft-nightlies.cern.ch pid 2>/dev/null)
            echo "  sft-nightlies: fds=$(t 10 lsof -b -w -p $pid 2>/dev/null | wc -l | tr -d ' ')" \
              "$(t 5 cvmfs_talk -i sft-nightlies.cern.ch internal affairs 2>/dev/null \
                 | grep -E '^(cvmfs\.no_open_files|cvmfs\.no_open_dirs|catalog_mgr\.n_nested_listing|cvmfs\.n_fs_open)\|' | cut -d'|' -f1,2 | tr '\n' ' ')"
            sleep 30
          done
          EOF
          chmod +x "$RUNNER_TEMP/revisions.sh"
          nohup "$RUNNER_TEMP/revisions.sh" > "$LOGS/revisions.txt" 2>&1 &

      - name: Checkout DD4hep
        uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          repository: wdconinc/DD4hep
          ref: ${{ env.DD4HEP_SHA }}
          path: DD4hep

      - uses: aidasoft/run-lcg-view@d8db17c61216548c9192889942d46ff2d7c3a3b6
        timeout-minutes: 150
        with:
          release-platform: ${{ matrix.LCG }}
          run: |
            cd DD4hep
            source .github/scripts/select_macos_sdk.sh
            mkdir build
            cd build
            unset CPATH
            source ../.github/scripts/common_cmake_opts.sh
            {
              cmake $=COMMON_CMAKE_OPTS -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=20 .. &&
              if [[ ${{ matrix.LCG }} =~ dev[34] ]]; then
                cmake -DDD4HEP_HEPMC3_COMPRESSION_SUPPORT=ON -DDD4HEP_USE_G4HEPEM=ON ..
              fi &&
              ninja install &&
              . ../bin/thisdd4hep.sh &&
              { ctest --output-on-failure -j"$(getconf _NPROCESSORS_ONLN)"; echo "ctest rc=$?"; } &&
              cd ../examples/ && mkdir build && cd build &&
              source ../../.github/scripts/common_cmake_opts.sh &&
              cmake $=COMMON_EXAMPLES_CMAKE_OPTS -DCMAKE_CXX_STANDARD=20 .. &&
              ninja install &&
              { ctest --output-on-failure -j"$(getconf _NPROCESSORS_ONLN)"; echo "examples ctest rc=$?"; }
            } 2>&1 | tee $LOGS/build.log
            rc=${pipestatus[1]}
            echo "pipeline rc=$rc"
            exit $rc

      - name: Collect logs
        if: always()
        timeout-minutes: 10
        run: |
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          sudo pkill -f watchdog.sh || true
          pkill -f rpcprobe.py || true
          sudo pkill tcpdump || true
          mkdir -p "$LOGS/pcap-end"
          ls -t "$RUNNER_TEMP"/pcap/lo0.pcap* 2>/dev/null | head -2 | xargs -I{} cp -p {} "$LOGS/pcap-end/" || true
          if [ -s "$RUNNER_TEMP/nfs4debug.log" ]; then
            ls -la "$RUNNER_TEMP/nfs4debug.log"
            tail -n 2000000 "$RUNNER_TEMP/nfs4debug.log" | gzip > "$LOGS/nfs4debug-end.log.gz"
          fi
          pkill -f revisions.sh || true
          mount | grep cvmfs > "$LOGS/mounts-end.txt" || true
          for r in $REPOS; do
            { echo "=== $r"; t 10 cvmfs_talk -i $r internal affairs; t 10 cvmfs_talk -i $r host info; } >> "$LOGS/talk-end.txt" 2>&1
          done
          sudo pkill -f "log stream" || true
          sudo log show --last 180m --style compact \
            --predicate 'process == "cvmfs2" OR process == "mount_nfs" OR (process == "kernel" AND eventMessage CONTAINS[c] "nfs")' \
            > "$LOGS/system.log" 2>/dev/null || true
          sudo sh -c "cp /Library/Logs/DiagnosticReports/cvmfs2* ~runner/Library/Logs/DiagnosticReports/cvmfs2* $LOGS/ 2>/dev/null" || true
          sudo chmod -R a+r "$LOGS"
          echo "::group::stalls"
          cat "$LOGS"/stall-*/stalls.txt 2>/dev/null || echo "no stalls"
          echo "::endgroup::"
          echo "::group::kernel nfs"
          grep -iE "nfs server|not responding|alive again|dead|unmount" "$LOGS/logstream.txt" | head -50 || true
          echo "::endgroup::"
          echo "::group::catalog switches"
          grep -E "switched to catalog|recalling|recall failed|sent [0-9]+ recalls" "$LOGS/logstream.txt" | head -50 || true
          echo "::endgroup::"
          echo "::group::crashes"
          grep -nE "Bus error|code=13[89]|exit code 13[89]|rc=13[89]|SIGBUS" "$LOGS/build.log" | head -20 || true
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfs-stall-${{ matrix.variant }}-${{ strategy.job-index }}
          path: logs
